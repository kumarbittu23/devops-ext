<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration</title>
    <style>
        body {
            max-width: 32rem;
            margin: 3rem auto;
            padding: 0 1rem;
            font: 1rem/1.5 Arial, sans-serif;
            color: #222;
        }
        form { display: grid; gap: 1rem; }
        label { display: grid; gap: 0.35rem; }
        input, select, button { box-sizing: border-box; padding: 0.65rem; font: inherit; }
        button { cursor: pointer; }
        #status { min-height: 1.5rem; }
    </style>
</head>
<body>
    <main>
        <h1>Student Registration</h1>
        <form id="registration-form">
            <label>
                Student Name
                <input name="studentName" type="text" autocomplete="name" required>
            </label>
            <label>
                Roll Number
                <input name="rollNumber" type="text" required>
            </label>
            <label>
                Email
                <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>
                Course
                <select name="course" required>
                    <option value="">Select a course</option>
                    <option value="computer-science">Computer Science</option>
                    <option value="business">Business</option>
                    <option value="engineering">Engineering</option>
                </select>
            </label>
            <button type="submit">Submit</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
        const form = document.querySelector("#registration-form");
        const status = document.querySelector("#status");
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            status.textContent = "Submitting...";
            try {
                const response = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams(new FormData(form))
                });
                status.textContent = await response.text();
                if (response.ok) form.reset();
            } catch {
                status.textContent = "Unable to submit. Please try again.";
            }
        });
    </script>
</body>
</html>
